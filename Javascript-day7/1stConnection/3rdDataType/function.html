<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //function - used to do specific task

        //1. function keyword symbol functioname()

        function Greet(){
            //Body - Instruction of Task

            console.log("Good Evening User")

        }

        Greet() //Calling The Function - to do the task

        //2. function with parameter (parameter - acts like variable)

        function Greeting(name){
            console.log(" Good Evening " + name)
    }
    Greeting("Aman")
    Greeting("Seejal")
    Greeting("Thala")


    //3. function with return keyword

    function Add(a,b){
        return a+b
    }
    let result =   Add(10,5)
    console.log(result)
    </script>
</body>
</html>
